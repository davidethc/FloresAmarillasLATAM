<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Para mi monita bonita</title>
  <link rel="icon" href="img/flowers.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <canvas id="sky" aria-hidden="true"></canvas>

  <main class="layout">
    <section class="photo-area">
      <figure class="polaroid" id="polaroid">
        <span class="tape"></span>
        <div class="polaroid__frame">
          <img class="polaroid__img" alt="Foto de nosotros">
          <img class="polaroid__img" alt="Foto de nosotros">
        </div>
        <figcaption class="polaroid__caption">mi monita bonita 🐵</figcaption>
      </figure>
      <p class="message" id="message">Este ramo es para ti 💛</p>
    </section>

    <section class="scene-area">
      <svg id="scene" viewBox="0 170 1000 930" preserveAspectRatio="xMidYMax meet"
           role="img" aria-label="Ramo de rosas amarillas, girasoles y margaritas"></svg>
    </section>
  </main>

  <button class="music" id="music" type="button" aria-label="Pausar música">♪</button>
  <audio id="song" src="img/Floricienta.mp3" autoplay loop></audio>

  <script src="main.js"></script>
</body>
</html>
